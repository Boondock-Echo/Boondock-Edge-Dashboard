name: Repair latest Dashboard release assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing immutable numbered release to copy to latest
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-edge-dashboard-release
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy verified numbered build to latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          ARCHIVE="boondock-edge-dashboard-${TAG}.tar.gz"
          gh release download "$TAG" --pattern "$ARCHIVE" --pattern "${ARCHIVE}.sha256"
          sha256sum --check "${ARCHIVE}.sha256"
          python3 - <<'PY'
          import json
          import os
          import tarfile
          from pathlib import PurePosixPath

          with tarfile.open(f"boondock-edge-dashboard-{os.environ['TAG']}.tar.gz") as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0] != 'dashboard':
                      raise ValueError('Unexpected archive path')
                  if not (member.isdir() or member.isfile()):
                      raise ValueError('Links and special files are not supported')
              info = json.load(archive.extractfile('dashboard/build-info.json'))
              assert info['component'] == 'dashboard'
              assert info['git_tag'] == os.environ['TAG']
              assert info['repository'] == 'Boondock-Echo/Boondock-Edge-Dashboard'
              for field in ('version', 'display_name', 'git_commit', 'built_at'):
                  assert isinstance(info[field], str) and info[field]
              assert archive.getmember('dashboard/index.html').isfile()
          PY
          LATEST_ARCHIVE="boondock-edge-dashboard-latest.tar.gz"
          cp "$ARCHIVE" "$LATEST_ARCHIVE"
          sha256sum "$LATEST_ARCHIVE" > "${LATEST_ARCHIVE}.sha256"
          gh release view latest >/dev/null
          git tag --force latest "${TAG}^{commit}"
          git push --force origin refs/tags/latest
          gh release upload latest "$LATEST_ARCHIVE" "${LATEST_ARCHIVE}.sha256" --clobber
